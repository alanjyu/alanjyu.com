<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <filter id="paper-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="grain" />
    <feTurbulence type="fractalNoise" baseFrequency="0.025 0.3" numOctaves="2" stitchTiles="stitch" result="fibers" />
    <feBlend in="grain" in2="fibers" mode="multiply" />
    <feColorMatrix type="saturate" values="0" />
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.12" />
    </feComponentTransfer>
  </filter>
  <path d="M0 0h256v256H0z" filter="url(#paper-grain)" />
</svg>
